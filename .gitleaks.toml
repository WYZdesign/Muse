# Gitleaks configuration — current schema (gitleaks >= 8.25).
#
# HISTORY: this file used the legacy singular `[allowlist]` table plus a set of
# hand-rolled `[[rules]]`. gitleaks 8.30.1 PANICS on the legacy table while
# building its config (`regexp.MustCompile` in config.parseAllowlist), which
# aborted the scanner before it read a single file. The current schema is
# `[[allowlists]]`.
#
# The hand-rolled rules were removed too: the stock gitleaks ruleset already
# covers AWS, GitHub, GitLab, Slack, Stripe, JWT/Supabase, private keys,
# database URLs and generic secrets, with entropy checks the old regexes
# lacked (the old "Generic Secret" pattern alone matched any 8-char value
# after the word "secret" — a false-positive machine).

[[allowlists]]
description = "Docs, tests, lockfiles and config fixtures are not production secrets"
paths = [
  '''.*\.md$''',
  '''.*\.txt$''',
  '''.*\.lock$''',
  '''.*\.test\.ts$''',
  '''.*\.spec\.ts$''',
  '''tests/.*''',
  '''.*\.config\.(ts|mts|js|mjs)$''',
  '''\.gitleaks\.toml$''',
]
