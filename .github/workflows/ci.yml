name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'

env:
  NODE_VERSION: '22'
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
  SUPABASE_SERVICE_ROLE_KEY: placeholder
  SUPABASE_SECRET_KEY: placeholder
  STRIPE_SECRET_KEY: placeholder
  NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com
  MUSE_DEMO_MODE: 'true'
  # Build-time fail-closed guard: src/lib/oauth-state.ts throws at module
  # evaluation if OAUTH_STATE_SECRET is unset, which aborts `next build` while
  # collecting page data for /api/muse/social. CI uses placeholders for every
  # other secret (nothing here is deployed), so this is a CI-only placeholder.
  OAUTH_STATE_SECRET: placeholder

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Semgrep (SAST)
        # `returntocorp/semgrep-action@v1` is stale: its bundled semgrep aborts
        # with "ValueError: invalid rule severity value: MEDIUM" against the
        # current registry packs, so `semgrep.sarif` was never written and the
        # SARIF upload step failed on every run. Install current semgrep and
        # scan directly (report-only — no --error, so findings are reported).
        run: |
          python3 -m pip install --quiet --disable-pip-version-check semgrep
          semgrep scan \
            --config p/ci --config p/typescript --config p/nodejs --config p/secrets \
            --sarif --output semgrep.sarif --metrics off
          test -f semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('semgrep.sarif') != '' }}
        with:
          sarif_file: semgrep.sarif

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check (cache-free)
        run: npx tsc --noEmit --incremental false

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

      - name: Start server
        run: nohup npx next start -p 3000 &
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com
          MUSE_DEMO_MODE: 'true'

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/muse -o /dev/null && exit 0
            sleep 1
          done
          echo "Server never came up" >&2
          exit 1

      - name: Run self-contained e2e specs
        # smoke + Priority A modal/width matrix. discover-deck kept (known stale
        # locators — documented gap, do not silently drop coverage).
        # accessibility.spec.ts runs in e2e-accessibility (full WCAG suite).
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/discover-deck.spec.ts --project=chromium-desktop --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: 'true'

  e2e-full:
    name: Full E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        project: [chromium-desktop, firefox-desktop, webkit-desktop, mobile-chrome-375, mobile-chrome-452, chromium-reduced-motion]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

      - name: Start server
        run: nohup npx next start -p 3000 &
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/muse -o /dev/null && exit 0
            sleep 1
          done
          echo "Server never came up" >&2
          exit 1

      - name: Run full E2E suite
        run: npx playwright test --project=${{ matrix.project }} --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  e2e-mobile:
    name: Mobile Visual Regression
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        viewport: [320, 375, 390, 452, 768]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

      - name: Start server
        run: nohup npx next start -p 3000 &
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/muse -o /dev/null && exit 0
            sleep 1
          done
          echo "Server never came up" >&2
          exit 1

      - name: Run mobile viewport tests
        run: npx playwright test tests/e2e/visual-regression.spec.ts --grep "${{ matrix.viewport }}px" --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: 'true'

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.viewport }}
          path: tests/__snapshots__/
          retention-days: 7

  e2e-accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

      - name: Start server
        run: nohup npx next start -p 3000 &
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/muse -o /dev/null && exit 0
            sleep 1
          done
          echo "Server never came up" >&2
          exit 1

      # Priority C suite (WCAG 2.1 AA + KNOWN_A11Y_GAPS baseline).
      # Replaces the old visual-regression --grep "Accessibility" wiring, which
      # hit stale feed locators and did not run accessibility.spec.ts.
      - name: Run accessibility tests
        run: npx playwright test tests/e2e/accessibility.spec.ts --project=chromium-desktop --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: 'true'

      - name: Upload axe results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe-results
          path: tests/axe-results/
          retention-days: 7

  e2e-demo-mode:
    name: Demo Mode Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
