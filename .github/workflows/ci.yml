          exit 1

      - name: Run demo negative mutation tests
        run: npx playwright test tests/e2e/demo-mode.spec.ts --grep "Demo Mode Negative" --project=chromium-desktop --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          MUSE_DEMO_MODE: 'true'
          CI: 'true'

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

      - name: Start server
        run: nohup npx next start -p 3000 &
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/muse -o /dev/null && exit 0
            sleep 1
          done
          echo "Server never came up" >&2
          exit 1

      - name: Run Lighthouse CI
        # Google Lighthouse CI is `@lhci/cli` (reads lighthouserc.js). The legacy
        # third-party `lighthouse-ci@1.13.1` wrapper (andreasonny83 — bin
        # `lighthouse-ci <url>`) was removed from package.json on 2026-09-25: it
        # was unused by every script/workflow and pulled a 9-vuln dev chain.
        # Invoke the real client pinned via npx so lighthouserc.js asserts run.
        run: npx --yes --package=@lhci/cli@0.15.1 lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CI: 'true'

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production — hard gate)
        # Runtime deps only. Current: 0 vulnerabilities (verified local 2026-09-24).
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (full tree — hard gate)
        # Dev + prod. Green since the unused legacy `lighthouse-ci@1.13.1`
        # wrapper (9 dev-only vulns: cookie/raven/lodash.set/got/update-notifier)
        # was removed from package.json on 2026-09-25. Do not drop the level.
        run: npm audit --audit-level=high

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # The action REQUIRES an output file — without it it aborts with
          # "validating options: results path is empty" (it previously had no
          # results_file, so this step failed on every run).
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          checks: --checks=Branch-Protection,Code-Review,Dependency-Update-Tool,Maintained,Pinned-Dependencies,SAST,Security-Policy,Token-Permissions,Vulnerabilities

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('results.sarif') != '' }}
        with:
          sarif_file: results.sarif

      - name: Run Gitleaks
        # gitleaks-action v2 is broken for this repo: it rejects the `config`
        # input ("Unexpected input(s) 'config', valid inputs are ['']") and then
        # crashes in its own SARIF writer whenever a finding has no
        # `partialFingerprints` — `TypeError: Cannot read properties of
        # undefined (reading 'commitSha')` at dist/index.js:129895. Run the
        # official gitleaks binary directly; it writes the same SARIF without
        # that crash. `--exit-code 0` reports findings as SARIF instead of
        # failing the job on a history-only match.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --report-format sarif --report-path gitleaks.sarif --exit-code 0 --no-banner
          test -f gitleaks.sarif

      - name: Upload Gitleaks SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('gitleaks.sarif') != '' }}
        with:
          sarif_file: gitleaks.sarif

      # ZAP scans http://localhost:3000/muse, but this job previously never
      # built or started the app — on scheduled runs it either failed to
      # connect or scanned nothing. Build + start + wait here (workflow-level
      # env already supplies every placeholder the build needs).
      - name: Build (for ZAP target)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Start server (for ZAP target)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: nohup npx next start -p 3000 &

      - name: Wait for server (for ZAP target)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/muse -o /dev/null && exit 0
            sleep 1
          done
          echo "Server never came up" >&2
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000/muse'
          fail_action: false
          issue_output: 'zap-report.xml'

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-report.xml
          retention-days: 7

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

  deploy-check:
    name: Deploy Verification
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, build, e2e-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # wyz_deploy_check.py lives on the integrator host (W:\WYZ_Command_Center),
      # not in this repo — previous `python wyz_deploy_check.py` always failed here.
      # Poll Vercel REST for a production READY deployment of this exact SHA.
      - name: Verify Vercel Deployment (production READY for this SHA)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Waiting for production deployment of ${SHA}..."
          for i in $(seq 1 45); do
            RESP=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=10" || true)
            if echo "$RESP" | jq -e --arg sha "$SHA" \
              '[.deployments[]? | select((.meta.githubCommitSha // .meta.commitSha // "") == $sha) | select(.readyState == "READY")] | length > 0' \
              >/dev/null 2>&1; then
              echo "DEPLOY IS LIVE ✅ ${SHA}"
              exit 0
            fi
            STATE=$(echo "$RESP" | jq -r --arg sha "$SHA" \
              '[.deployments[]? | select((.meta.githubCommitSha // .meta.commitSha // "") == $sha) | .readyState] | first // "NOT_FOUND"' \
              2>/dev/null || echo "PARSE_ERR")
            echo "attempt ${i}: state=${STATE}"
            sleep 20
          done
          echo "Deploy ${SHA} did not reach READY in time" >&2
          exit 1

  renovate:
    name: Renovate Dependency Updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.repository == 'WYZdesign/Muse'
    env:
      # Job-level so the step guard below can read it — the `secrets` context is
      # not available in a job-level `if`. Renovate is optional bot tooling, not
      # a release gate: skip cleanly when the token is absent instead of failing
      # on every push. Owner action: add RENOVATE_TOKEN to enable the bot.
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run Renovate
        if: env.RENOVATE_TOKEN != ''
        uses: renovatebot/github-action@v46.3.3
        with:
          configurationFile: renovate.json
          token: ${{ env.RENOVATE_TOKEN }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, build, e2e-smoke, e2e-full, e2e-mobile, e2e-accessibility, e2e-demo-mode, e2e-demo-negative, lighthouse, security-audit, sbom, deploy-check]
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "CI pipeline failed"
          # Add Slack/Discord/email notification here