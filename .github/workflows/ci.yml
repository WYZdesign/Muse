name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

  # Playwright specs existed (tests/*.spec.ts, npm run test:e2e) but were never
  # wired into CI — they only ran when someone remembered to run them by hand
  # against the LIVE site (playwright.config.ts's default baseURL). That's how
  # the MutationObserver freeze (tests/discover-freeze.spec.ts, added as its
  # regression test) could have shipped even with a test written for it: the
  # test existing didn't mean it ran. This job builds once, serves it locally
  # (never touches production), and runs the subset of specs that are fully
  # self-contained — no real Supabase/Stripe credentials needed, matching the
  # placeholder env the build job above already uses successfully.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com

      - name: Start server
        run: nohup npx next start -p 3000 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/muse -o /dev/null && exit 0
            sleep 1
          done
          echo "Server never came up" >&2
          exit 1

      - name: Run self-contained e2e specs against the local build
        run: npx playwright test tests/smoke.spec.ts tests/discover-freeze.spec.ts
        env:
          E2E_BASE_URL: http://localhost:3000
