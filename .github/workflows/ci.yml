          echo "Server never came up" >&2
          exit 1

      - name: Run demo mode tests
        run: npx playwright test tests/e2e/demo-mode.spec.ts --project=chromium-desktop --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          MUSE_DEMO_MODE: 'true'
          CI: 'true'

  e2e-demo-negative:
    name: Demo Mode Negative Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          STRIPE_SECRET_KEY: placeholder
          NEXT_PUBLIC_SUPPORT_EMAIL: info@wyzdesign.com
          MUSE_DEMO_MODE: 'true'

      - name: Start server
        run: nohup npx next start -p 3000 &
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
